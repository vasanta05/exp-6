
name: Student Placement Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t student-placement-app .

      - name: Start Docker container
        run: |
          docker run -d \
            --name placement-container \
            -p 5000:5000 \
            student-placement-app

      - name: Check container health endpoint
        run: |
          for i in $(seq 1 15); do
            if curl --fail http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs placement-container
          exit 1

      - name: Test prediction endpoint
        run: |
          curl --fail \
            -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"cgpa":8,"aptitude_score":80,"communication_score":75,"internships":2}'

      - name: Stop container
        if: always()
        run: docker rm -f placement-container || true
